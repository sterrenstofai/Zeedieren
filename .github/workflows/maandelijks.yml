name: Maandelijks verversen

# Haalt het getij opnieuw op, kijkt de weetjes na tegen hun bronnen en bouwt site/data opnieuw.
# Een weetje dat niet meer op zijn bronpagina staat, gaat van de site.
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verversen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/getij_ophalen.py 14
      - run: python3 scripts/ruw_ophalen.py
      - run: python3 scripts/nakijken.py
      - run: python3 scripts/bouw_site_data.py
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data netlify.toml
          git diff --cached --quiet || git commit -m "Maandelijkse verversing van de data"
          git pull --rebase origin main
          git push
