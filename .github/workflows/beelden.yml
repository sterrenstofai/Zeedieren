name: Beelden ophalen

# Haalt de gekozen foto's, platen en geluiden op van Commons
# (data/beeld_keuze.json): Commons geeft vanaf gewone machines een 429.
on:
  push:
    branches: [main]
    paths: ["data/beeld_keuze.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 scripts/beelden_ophalen.py && python3 scripts/nakijken.py && python3 scripts/bouw_site_data.py
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site data netlify.toml
          git diff --cached --quiet || git commit -m "Beelden opgehaald"
          git pull --rebase origin main
          git push
